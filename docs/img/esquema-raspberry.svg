<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1040" viewBox="0 0 1300 1040" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <title>UFOMOUNT: conexión con Raspberry Pi 4</title>
  <defs>
    <style>
      .box { fill:#F5F7FA; stroke:#37474F; stroke-width:2; }
      .t { font-size:15px; font-weight:700; fill:#263238; }
      .s { font-size:12px; fill:#455A64; }
      .tiny { font-size:10px; fill:#455A64; }
      .w24 { stroke:#B71C1C; stroke-width:4; fill:none; }
      .w75 { stroke:#E53935; stroke-width:3.5; fill:none; }
      .w5 { stroke:#8E24AA; stroke-width:3; fill:none; }
      .wx { stroke:#F08A2E; stroke-width:2.6; fill:none; }
      .wy { stroke:#1E88E5; stroke-width:2.6; fill:none; }
      .wg { stroke:#212121; stroke-width:2.6; fill:none; }
      .wd { stroke:#607D8B; stroke-width:3; fill:none; }
      .gnd { stroke:#212121; stroke-width:2; fill:none; }
      .pin { fill:#C9A227; }
      .onpi { fill:#FFFFFF; font-size:11px; }
    </style>
  </defs>
  <rect width="1300" height="1040" fill="#FFFFFF"/>

  <text x="30" y="36" font-size="22" font-weight="700" fill="#263238">UFOMOUNT · conexión con Raspberry Pi 4</text>
  <text x="30" y="58" class="s">Alimentación en secuencia por PoE pasivo · servos por el PWM de la Pi · cámara por USB</text>

  <g transform="translate(0,50)">

  <!-- ================= cadena de alimentacion ================= -->
  <!-- fuente 24 V DC -->
  <rect class="box" x="30" y="55" width="170" height="70" rx="8"/>
  <text x="115" y="84" class="t" text-anchor="middle">Fuente 24 V DC</text>
  <text x="115" y="104" class="s" text-anchor="middle">entrada de la cadena</text>
  <path class="gnd" d="M115 125 V133 M105 133 H125 M109 137 H121 M113 141 H117"/>

  <!-- red -->
  <rect class="box" x="30" y="150" width="170" height="65" rx="8"/>
  <text x="115" y="178" class="t" text-anchor="middle">Red / PC</text>
  <text x="115" y="198" class="s" text-anchor="middle">Ethernet (datos)</text>

  <!-- inyector -->
  <rect class="box" x="250" y="55" width="170" height="160" rx="8"/>
  <text x="335" y="118" class="t" text-anchor="middle">PoE pasivo</text>
  <text x="335" y="138" class="s" text-anchor="middle">inyector</text>
  <text x="335" y="156" class="s" text-anchor="middle">junta 24 V + red</text>
  <path class="w24" d="M200 90 H250"/>
  <path class="wd" d="M200 180 H250"/>

  <!-- cable de red con PoE -->
  <path d="M420 135 H600" stroke="#78909C" stroke-width="11" fill="none"/>
  <path d="M420 135 H600" stroke="#B71C1C" stroke-width="2.5" fill="none"/>
  <text x="510" y="117" text-anchor="middle" font-size="12" font-weight="700" fill="#37474F">cable de red</text>
  <text x="510" y="161" text-anchor="middle" font-size="11" fill="#455A64">datos + 24 V</text>

  <!-- splitter -->
  <rect class="box" x="600" y="55" width="170" height="160" rx="8"/>
  <text x="685" y="118" class="t" text-anchor="middle">PoE pasivo</text>
  <text x="685" y="138" class="s" text-anchor="middle">splitter</text>
  <text x="685" y="156" class="s" text-anchor="middle">(en la montura)</text>
  <text x="764" y="186" class="tiny" text-anchor="end">LAN</text>

  <!-- 24 V: splitter -> XL4016 -->
  <path class="w24" d="M770 90 H830"/>
  <text x="800" y="82" text-anchor="middle" font-size="11" fill="#B71C1C">24 V</text>

  <!-- XL4016 -->
  <rect class="box" x="830" y="50" width="170" height="80" rx="8"/>
  <text x="915" y="78" class="t" text-anchor="middle">XL4016 (buck)</text>
  <text x="915" y="98" class="s" text-anchor="middle">salida 7,5 V · 6 A</text>
  <text x="915" y="115" class="s" text-anchor="middle">servos + MP1584</text>
  <path class="gnd" d="M915 130 V138 M905 138 H925 M909 142 H921 M913 146 H917"/>

  <!-- 7,5 V: XL4016 -> servos y MP1584 -->
  <path class="w75" d="M1000 90 H1050 V225"/>
  <path class="w75" d="M1050 225 H355 V560"/>
  <path class="w75" d="M560 225 V250"/>
  <circle cx="560" cy="225" r="5" fill="#E53935"/>
  <path class="w75" d="M870 225 V250"/>
  <circle cx="1050" cy="225" r="5" fill="#E53935"/>
  <circle cx="870" cy="225" r="5" fill="#E53935"/>
  <text x="885" y="217" font-size="11" fill="#C62828">V+ (rojo) de los servos</text>
  <text x="1058" y="200" font-size="11" fill="#C62828">7,5 V</text>
  <text x="361" y="552" font-size="11" fill="#C62828">IN 7,5 V</text>

  <!-- ================= servos ================= -->
  <rect class="box" x="500" y="250" width="200" height="80" rx="8"/>
  <text x="600" y="280" class="t" text-anchor="middle">Servo X · pan 270°</text>
  <text x="600" y="300" class="s" text-anchor="middle">GX3350 (X50 Pro)</text>
  <text x="600" y="317" class="tiny" text-anchor="middle">V+ arriba · señal y GND abajo</text>

  <rect class="box" x="740" y="250" width="200" height="80" rx="8"/>
  <text x="840" y="280" class="t" text-anchor="middle">Servo Y · tilt 180°</text>
  <text x="840" y="300" class="s" text-anchor="middle">GX3350 (X50 Pro)</text>
  <text x="840" y="317" class="tiny" text-anchor="middle">V+ arriba · señal y GND abajo</text>

  <!-- ================= Raspberry Pi 4 ================= -->
  <rect x="470" y="420" width="460" height="270" rx="14" fill="#1E6B3A" stroke="#0F3D22" stroke-width="2"/>
  <circle cx="488" cy="438" r="5" fill="#0F3D22"/>
  <circle cx="912" cy="438" r="5" fill="#0F3D22"/>
  <circle cx="488" cy="672" r="5" fill="#0F3D22"/>
  <circle cx="912" cy="672" r="5" fill="#0F3D22"/>
  <rect x="520" y="426" width="324" height="68" rx="3" fill="#111111"/>
  <text x="682" y="526" text-anchor="middle" font-size="11" fill="#C8E6C9">pares arriba · impares abajo · □ = pin 1, lejos de la red y los USB</text>
  <text x="700" y="582" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">Raspberry Pi 4</text>
  <text x="700" y="606" text-anchor="middle" font-size="13" fill="#E8F5E9">asicam_server.py: cámara + servos (PTZ)</text>
  <text x="700" y="626" text-anchor="middle" font-size="12" fill="#C8E6C9">PWM por hardware: GPIO18 = X · GPIO13 = Y</text>

  <!-- puertos en su lugar real: red y USB del lado de los pines 39/40; USB-C abajo, del lado del pin 1 -->
  <rect x="916" y="436" width="28" height="30" rx="3" fill="#ECEFF1" stroke="#455A64" stroke-width="1.5"/>
  <rect x="918" y="560" width="26" height="26" rx="3" fill="#CFD8DC" stroke="#455A64" stroke-width="1.5"/>
  <text x="910" y="577" text-anchor="end" class="onpi">USB</text>
  <rect x="518" y="678" width="24" height="22" rx="3" fill="#CFD8DC" stroke="#455A64" stroke-width="1.5"/>
  <text x="530" y="670" text-anchor="middle" class="onpi">USB-C</text>

  <!-- red: splitter -> Ethernet de la Pi -->
  <path class="wd" d="M770 190 H1020 V219 A6 6 0 0 1 1020 231 V451 H944"/>
  <text x="982" y="443" text-anchor="middle" font-size="10" fill="#455A64">Ethernet</text>

  <!-- MP1584 -->
  <rect class="box" x="260" y="560" width="180" height="80" rx="8"/>
  <text x="350" y="588" class="t" text-anchor="middle">MP1584 (buck)</text>
  <text x="350" y="608" class="s" text-anchor="middle">salida 5,15 V</text>
  <text x="350" y="625" class="tiny" text-anchor="middle">ajustar 5,1–5,2 V</text>
  <path class="gnd" d="M290 640 V648 M280 648 H300 M284 652 H296 M288 656 H292"/>
  <!-- 5,15 V -> USB-C de la Pi (abajo) -->
  <path class="w5" d="M380 640 V712 H530 V700"/>
  <text x="455" y="706" text-anchor="middle" font-size="11" fill="#8E24AA">5,15 V</text>

  <!-- camara -->
  <path class="wd" d="M944 573 H990"/>
  <rect class="box" x="990" y="538" width="180" height="70" rx="8"/>
  <text x="1080" y="566" class="t" text-anchor="middle">Cámara ZWO</text>
  <text x="1080" y="586" class="s" text-anchor="middle">ASI220MM Mini · USB 2.0</text>

  <!-- ================= señales de los servos ================= -->
  <!-- servo X: señal -> pin 12, GND -> pin 14 -->
  <path class="wx" d="M610 330 V426"/>
  <path class="wg" d="M626 330 V426"/>
  <rect x="603" y="352" width="14" height="28" fill="#FFFFFF" stroke="#F08A2E" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="597" y="364" text-anchor="end" class="tiny">470 Ω–1 kΩ</text>
  <text x="597" y="377" text-anchor="end" class="tiny">(opcional)</text>
  <text x="604" y="346" text-anchor="end" font-size="12" fill="#C25E0A">pin 12 · GPIO18</text>
  <text x="632" y="408" font-size="12" fill="#212121">pin 14 · GND</text>

  <!-- servo Y: señal -> pin 33 (por debajo del conector), GND -> pin 34 -->
  <path class="wy" d="M900 330 V506 H786 V494"/>
  <path class="wg" d="M786 330 V426"/>
  <rect x="893" y="352" width="14" height="28" fill="#FFFFFF" stroke="#1E88E5" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="913" y="364" class="tiny">470 Ω–1 kΩ</text>
  <text x="913" y="377" class="tiny">(opcional)</text>
  <text x="906" y="408" font-size="12" fill="#1565C0">pin 33 · GPIO13</text>
  <text x="780" y="384" text-anchor="end" font-size="12" fill="#212121">pin 34 · GND</text>

  <!-- ventilador de la caja: pin 4 (+5 V) y pin 6 (GND) -->
  <rect class="box" x="368" y="372" width="94" height="60" rx="8"/>
  <circle cx="383" cy="388" r="8" fill="none" stroke="#455A64" stroke-width="1.5"/>
  <path d="M383 388 L383 381 M383 388 L389 392 M383 388 L377 392" stroke="#455A64" stroke-width="1.5"/>
  <text x="397" y="392" font-size="12" font-weight="700" fill="#263238">Ventilador</text>
  <text x="415" y="408" text-anchor="middle" class="tiny">pin 6: GND</text>
  <text x="415" y="423" text-anchor="middle" class="tiny">pin 4: +5 V</text>
  <path class="wg" d="M462 400 H562 V426"/>
  <path class="w5" d="M462 415 H546 V426"/>

  <!-- pines numerados: fila de arriba = pares (borde de la placa), abajo = impares -->
  <g>
    <rect class="pin" x="525.5" y="459.5" width="9" height="9"/>
    <text x="530" y="485" text-anchor="middle" font-size="8" fill="#B0BEC5">1</text>
    <circle class="pin" cx="530" cy="448" r="4.5"/>
    <text x="530" y="437" text-anchor="middle" font-size="8" fill="#B0BEC5">2</text>
    <circle class="pin" cx="546" cy="464" r="4.5"/>
    <text x="546" y="485" text-anchor="middle" font-size="8" fill="#B0BEC5">3</text>
    <circle cx="546" cy="448" r="5.5" fill="#CE93D8" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="546" y="437" text-anchor="middle" font-size="8.5" font-weight="700" fill="#FFFFFF">4</text>
    <circle class="pin" cx="562" cy="464" r="4.5"/>
    <text x="562" y="485" text-anchor="middle" font-size="8" fill="#B0BEC5">5</text>
    <circle cx="562" cy="448" r="5.5" fill="#424242" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="562" y="437" text-anchor="middle" font-size="8.5" font-weight="700" fill="#FFFFFF">6</text>
    <circle class="pin" cx="578" cy="464" r="4.5"/>
    <text x="578" y="485" text-anchor="middle" font-size="8" fill="#B0BEC5">7</text>
    <circle class="pin" cx="578" cy="448" r="4.5"/>
    <text x="578" y="437" text-anchor="middle" font-size="8" fill="#B0BEC5">8</text>
    <circle class="pin" cx="594" cy="464" r="4.5"/>
    <text x="594" y="485" text-anchor="middle" font-size="8" fill="#B0BEC5">9</text>
    <circle class="pin" cx="594" cy="448" r="4.5"/>
    <text x="594" y="437" text-anchor="middle" font-size="8" fill="#B0BEC5">10</text>
    <circle class="pin" cx="610" cy="464" r="4.5"/>
    <text x="610" y="485" text-anchor="middle" font-size="8" fill="#B0BEC5">11</text>
    <circle cx="610" cy="448" r="5.5" fill="#F08A2E" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="610" y="437" text-anchor="middle" font-size="8.5" font-weight="700" fill="#FFFFFF">12</text>
    <circle class="pin" cx="626" cy="464" r="4.5"/>
    <text x="626" y="485" text-anchor="middle" font-size="8" fill="#B0BEC5">13</text>
    <circle cx="626" cy="448" r="5.5" fill="#424242" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="626" y="437" text-anchor="middle" font-size="8.5" font-weight="700" fill="#FFFFFF">14</text>
    <circle class="pin" cx="642" cy="464" r="4.5"/>
    <text x="642" y="485" text-anchor="middle" font-size="8" fill="#B0BEC5">15</text>
    <circle class="pin" cx="642" cy="448" r="4.5"/>
    <text x="642" y="437" text-anchor="middle" font-size="8" fill="#B0BEC5">16</text>
    <circle class="pin" cx="658" cy="464" r="4.5"/>
    <text x="658" y="485" text-anchor="middle" font-size="8" fill="#B0BEC5">17</text>
    <circle class="pin" cx="658" cy="448" r="4.5"/>
    <text x="658" y="437" text-anchor="middle" font-size="8" fill="#B0BEC5">18</text>
    <circle class="pin" cx="674" cy="464" r="4.5"/>
    <text x="674" y="485" text-anchor="middle" font-size="8" fill="#B0BEC5">19</text>
    <circle class="pin" cx="674" cy="448" r="4.5"/>
    <text x="674" y="437" text-anchor="middle" font-size="8" fill="#B0BEC5">20</text>
    <circle class="pin" cx="690" cy="464" r="4.5"/>
    <text x="690" y="485" text-anchor="middle" font-size="8" fill="#B0BEC5">21</text>
    <circle class="pin" cx="690" cy="448" r="4.5"/>
    <text x="690" y="437" text-anchor="middle" font-size="8" fill="#B0BEC5">22</text>
    <circle class="pin" cx="706" cy="464" r="4.5"/>
    <text x="706" y="485" text-anchor="middle" font-size="8" fill="#B0BEC5">23</text>
    <circle class="pin" cx="706" cy="448" r="4.5"/>
    <text x="706" y="437" text-anchor="middle" font-size="8" fill="#B0BEC5">24</text>
    <circle class="pin" cx="722" cy="464" r="4.5"/>
    <text x="722" y="485" text-anchor="middle" font-size="8" fill="#B0BEC5">25</text>
    <circle class="pin" cx="722" cy="448" r="4.5"/>
    <text x="722" y="437" text-anchor="middle" font-size="8" fill="#B0BEC5">26</text>
    <circle class="pin" cx="738" cy="464" r="4.5"/>
    <text x="738" y="485" text-anchor="middle" font-size="8" fill="#B0BEC5">27</text>
    <circle class="pin" cx="738" cy="448" r="4.5"/>
    <text x="738" y="437" text-anchor="middle" font-size="8" fill="#B0BEC5">28</text>
    <circle class="pin" cx="754" cy="464" r="4.5"/>
    <text x="754" y="485" text-anchor="middle" font-size="8" fill="#B0BEC5">29</text>
    <circle class="pin" cx="754" cy="448" r="4.5"/>
    <text x="754" y="437" text-anchor="middle" font-size="8" fill="#B0BEC5">30</text>
    <circle class="pin" cx="770" cy="464" r="4.5"/>
    <text x="770" y="485" text-anchor="middle" font-size="8" fill="#B0BEC5">31</text>
    <circle class="pin" cx="770" cy="448" r="4.5"/>
    <text x="770" y="437" text-anchor="middle" font-size="8" fill="#B0BEC5">32</text>
    <circle cx="786" cy="464" r="5.5" fill="#1E88E5" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="786" y="485" text-anchor="middle" font-size="8.5" font-weight="700" fill="#FFFFFF">33</text>
    <circle cx="786" cy="448" r="5.5" fill="#424242" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="786" y="437" text-anchor="middle" font-size="8.5" font-weight="700" fill="#FFFFFF">34</text>
    <circle class="pin" cx="802" cy="464" r="4.5"/>
    <text x="802" y="485" text-anchor="middle" font-size="8" fill="#B0BEC5">35</text>
    <circle class="pin" cx="802" cy="448" r="4.5"/>
    <text x="802" y="437" text-anchor="middle" font-size="8" fill="#B0BEC5">36</text>
    <circle class="pin" cx="818" cy="464" r="4.5"/>
    <text x="818" y="485" text-anchor="middle" font-size="8" fill="#B0BEC5">37</text>
    <circle class="pin" cx="818" cy="448" r="4.5"/>
    <text x="818" y="437" text-anchor="middle" font-size="8" fill="#B0BEC5">38</text>
    <circle class="pin" cx="834" cy="464" r="4.5"/>
    <text x="834" y="485" text-anchor="middle" font-size="8" fill="#B0BEC5">39</text>
    <circle class="pin" cx="834" cy="448" r="4.5"/>
    <text x="834" y="437" text-anchor="middle" font-size="8" fill="#B0BEC5">40</text>
  </g>

  <g transform="translate(0,30)">
  <!-- ================= leyenda ================= -->
  <g font-size="12" fill="#263238">
    <path class="w24" d="M30 730 H60"/><text x="66" y="734">24 V</text>
    <path d="M115 730 H145" stroke="#78909C" stroke-width="9"/><path d="M115 730 H145" stroke="#B71C1C" stroke-width="2.5"/><text x="151" y="734">cable PoE</text>
    <path class="w75" d="M230 730 H260"/><text x="266" y="734">7,5 V</text>
    <path class="w5" d="M320 730 H350"/><text x="356" y="734">5,15 V</text>
    <path class="wx" d="M420 730 H450"/><text x="456" y="734">señal X</text>
    <path class="wy" d="M520 730 H550"/><text x="556" y="734">señal Y</text>
    <path class="wg" d="M620 730 H650"/><text x="656" y="734">GND</text>
    <path class="wd" d="M705 730 H735"/><text x="741" y="734">red / USB</text>
    <path class="gnd" d="M830 723 V729 M820 729 H840 M824 733 H836 M828 737 H832"/><text x="848" y="734">GND común: todos los negativos unidos</text>
  </g>

  <!-- ================= notas ================= -->
  <rect x="30" y="756" width="1240" height="196" rx="8" fill="#FAFAFA" stroke="#CFD8DC"/>
  <text x="46" y="780" font-size="13" font-weight="700" fill="#263238">Notas</text>
  <g font-size="12" fill="#263238">
    <text x="46" y="804">1. Secuencia: fuente 24 V DC → inyector PoE pasivo (suma la red) → cable → splitter en la montura → XL4016 7,5 V 6 A → servos X e Y; del XL4016 sale también el MP1584 (5,15 V) → Pi.</text>
    <text x="46" y="826">2. PWM por hardware en /boot/config.txt (ya activado): <tspan font-family="Consolas, monospace">dtoverlay=pwm-2chan,pin=18,func=2,pin2=13,func2=4</tspan></text>
    <text x="46" y="848">3. El rojo (V+) de los servos va solo a los 7,5 V: nunca a un pin de la Pi. Conectar y desconectar con la alimentación apagada.</text>
    <text x="46" y="870">4. MP1584 en 5,1–5,2 V con el potenciómetro fijado. La Pi suma ~1,5–2 A a los 7,5 V: si marca subtensión al mover los servos (<tspan font-family="Consolas, monospace">vcgencmd get_throttled</tspan> distinto de 0x0), tomar su entrada de los 24 V.</text>
    <text x="46" y="892">5. A la Pi por USB-C (conserva su protección) o por el pin 2 (+5 V) y un GND (sin protección); el 4 y el 6 los usa el ventilador. Resistencias de 470 Ω–1 kΩ en las señales: opcionales, protegen el GPIO.</text>
    <text x="46" y="914">6. Red: un PoE pasivo de 2 pares deja la red en 100 Mbps (unos 5 fps a 1080p). Para los 14 fps: inyector y splitter PoE pasivo gigabit, o un cable de red aparte para la Pi.</text>
    <text x="46" y="936">7. Orientación: el pin 1 está en la punta opuesta a la red y los USB; los pines 39 y 40 quedan junto al Ethernet. Los GX3350 aceptan los 3,3 V de la Pi.</text>
  </g>

  </g>

  </g>
</svg>
